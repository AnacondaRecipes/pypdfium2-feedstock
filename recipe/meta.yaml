{% set name = "pypdfium2" %}
{% set version = "5.12.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d0e0648fb2e28f50efcd1ec0a5a18ced9f4d66b2c227fae9b603f0a883b2d13f

build:
  # win-64 needs the sourcebuild-toolchained backend (depot_tools + MSVC); that
  # integration is deferred to a follow-up ticket.
  skip: True  # [win or (linux and (s390x or ppc64le))]
  entry_points:
    - pypdfium2 = pypdfium2_cli.__main__:cli_main
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - gn          # [not win]
    - ninja-base  # [not win]
    - llvm-tools  # [osx]     provides llvm-ar (pdfium's `ar -D` needs it; Apple ar lacks -D)
    - lld         # [osx]     provides ld64.lld (pdfium's clang-mode link uses lld)
    - git
    - python
  host:
    - python
    - setuptools
    - packaging
    - pip
    - wheel
    # pypdfium2 5.7.0's bindings step calls ctypesgen with newer flags
    # (--rt-libpaths/--ct-libpaths/--symbol-rules/--no-system-libsearch) that only
    # the 5.4.0 fork understands; 1.1.1+N on pkgs/main is too old (metadata-gen fails).
    - ctypesgen-pypdfium2-team >=5.4.0
    # Unvendored third-party libs (build.sh --no-vendor): pdfium links these conda
    # copies instead of bundling. Their run_exports add them to run, so they're
    # tracked as real dependencies (CBC pins the versions). Only libs pdfium
    # actually links are listed -- libpng/libtiff are XFA-only codecs and XFA is
    # off, so they're deliberately left vendored/unlinked (verified: not in DT_NEEDED).
    - zlib
    - lcms2
    - openjpeg
    - freetype
    - libjpeg-turbo
  run:
    - python

test:
  imports:
    - pypdfium2
  commands:
    - pip check
    - pypdfium2 --help
  requires:
    - pip

about:
  home: https://github.com/pypdfium2-team/pypdfium2
  summary: Python bindings to PDFium
  description: |
    pypdfium2 is an ABI-level Python 3 binding to PDFium, a powerful and liberal-licensed library for PDF rendering,
    inspection, manipulation and creation.
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSES/Apache-2.0.txt
    - LICENSES/BSD-3-Clause.txt
    - LICENSES/CC-BY-4.0.txt
  doc_url: https://pypdfium2.readthedocs.io/en/stable
  dev_url: https://github.com/pypdfium2-team/pypdfium2

extra:
  recipe-maintainers:
    - boldorider4
