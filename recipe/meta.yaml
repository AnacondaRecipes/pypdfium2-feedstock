{% set name = "pypdfium2" %}
{% set version = "5.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9febb09f532555485f064c1f6442f46d31e27be5981359cb06b5826695906a06

build:
  skip: True  # [linux and (s390x or ppc64le)]
  entry_points:
    - pypdfium2 = pypdfium2_cli.__main__:cli_main
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - gn          # [not win]
    - ninja-base  # [not win]
    - git
    - python
  host:
    - python
    - setuptools
    - packaging
    - pip
    - wheel
    # Upstream pins ctypesgen to a version-less git HEAD of the pypdfium2 fork;
    # the conda fork versions as 1.1.1+N, so take whatever is newest on the channel.
    - ctypesgen-pypdfium2-team
  run:
    - python

test:
  imports:
    - pypdfium2
  commands:
    - pip check
    - pypdfium2 --help
  requires:
    - pip

about:
  home: https://github.com/pypdfium2-team/pypdfium2
  summary: Python bindings to PDFium
  description: |
    pypdfium2 is an ABI-level Python 3 binding to PDFium, a powerful and liberal-licensed library for PDF rendering,
    inspection, manipulation and creation.
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSES/Apache-2.0.txt
    - LICENSES/BSD-3-Clause.txt
    - LICENSES/CC-BY-4.0.txt
  doc_url: https://pypdfium2.readthedocs.io/en/stable
  dev_url: https://github.com/pypdfium2-team/pypdfium2

extra:
  recipe-maintainers:
    - boldorider4
